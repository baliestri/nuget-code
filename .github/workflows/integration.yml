name: .NET integration

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full commit SHA to validate.
        required: true
        type: string
    outputs:
      source_sha:
        description: Commit SHA that passed the complete SDK matrix.
        value: ${{ jobs.gate.outputs.source_sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdk:
    name: SDK ${{ matrix.sdk.major }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk:
          - { major: "8", version: "8.0.425" }
          - { major: "9", version: "9.0.318" }
          - { major: "10", version: "10.0.401" }
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SDK_MAJOR: ${{ matrix.sdk.major }}
      SDK_VERSION: ${{ matrix.sdk.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Validate source SHA
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Expected a full lowercase commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.sdk.version }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test effective SDK and package operations
        run: pnpm --filter @nuget-code/client run test:integration

  gate:
    name: SDK matrix result
    if: ${{ always() }}
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Require every SDK and platform
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SDK_RESULT: ${{ needs.sdk.result }}
        run: |
          printf 'SDK 8/9/10 on Windows/Linux: %s\n' "$SDK_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$SDK_RESULT" = success
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
