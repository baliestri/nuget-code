name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Called by prepare-release.yml to validate a release candidate before it is merged.
  workflow_call:
    inputs:
      ref:
        description: The commit to check; the ref of the calling run when empty.
        type: string
        default: ""

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # The tests that need no backend process. The contract tests run per target, against the published binary.
      - run: pnpm exec vitest run --dir scripts

      - run: pnpm --filter @nuget-code/protocol test

      - run: pnpm --filter @nuget-code/bridge test

      - run: pnpm --filter @nuget-code/console-protocol test

      - run: pnpm --filter @nuget-code/webview test

      - run: pnpm --filter nuget-code test

  targets:
    name: Targets
    uses: ./.github/workflows/build-target.yml
    with:
      ref: ${{ inputs.ref }}

  integration:
    name: Editor (${{ matrix.target }})
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, os: windows-latest }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: darwin-arm64, os: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The backend runs dotnet msbuild on the test project.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: vsix-${{ matrix.target }}
          path: release-artifacts

      # A VSIX is a zip: the binary and the module of the console are taken out of the very file that would
      # be installed.
      - name: Take the backend and the console module out of the VSIX
        run: |
          vsix="$(ls release-artifacts/*.vsix)"
          mkdir -p vsix
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The tar that ships with Windows reads zip archives. The unzip of the runner's shell does not
            # match the entry names of the archive.
            "$SYSTEMROOT/System32/tar.exe" -xf "$vsix" -C vsix extension/bin extension/console
          else
            unzip -o "$vsix" "extension/bin/*" "extension/console/*" -d vsix
          fi
          rm -rf apps/extension/bin apps/extension/console
          cp -R vsix/extension/bin apps/extension/bin
          cp -R vsix/extension/console apps/extension/console
          chmod -R +x apps/extension/bin

      # The smoke test of the console is skipped where there is no PowerShell new enough for the module.
      - name: Install the PowerShell the console module is built for
        run: |
          version="$(sed -n 's/.*Include="System.Management.Automation" Version="\([^"]*\)".*/\1/p' backend/Directory.Packages.props)"
          dotnet tool install --global PowerShell --version "$version"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
          else
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Smoke tests in the editor
        env:
          NUGET_VSCODE_BACKEND_BUNDLED: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --filter nuget-code test:integration
          else
            pnpm --filter nuget-code test:integration
          fi
