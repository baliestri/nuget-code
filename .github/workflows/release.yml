name: Release

# A tag v<version> builds the eight VSIX files and attaches them to a GitHub release. A plain
# major.minor.patch version is also published; neither marketplace accepts a version with a pre-release
# suffix such as 3.0.0-alpha.0, so such a tag only gets the GitHub release.
#
# Both marketplaces are published with trusted publishing: the job's OIDC token is exchanged for a
# short-lived publishing token, and no long-lived secret is stored. The trusted publisher is configured on
# each marketplace for this repository and this workflow file, so renaming the file breaks publishing.
#
# It also starts by dispatch, which is how prepare-release.yml starts it: a tag pushed by a workflow does not
# start another workflow. A dispatch has to be on the tag; on a branch, the first job fails.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: The tag matches the extension version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: |
          version="$(node -p "require('./apps/extension/package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Run this on the tag v$version: it ran on the $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi

  targets:
    name: Targets
    needs: verify
    uses: ./.github/workflows/build-target.yml
    with:
      package_windows: false

  # The Windows backends are Authenticode-signed before they go into their VSIX, so a signing failure
  # leaves no release behind. The approval of the release-signing environment is asked here.
  sign:
    name: Sign Windows backends
    needs: targets
    uses: ./.github/workflows/sign.yml
    secrets: inherit

  package-windows:
    name: Package ${{ matrix.target }} with the signed backend
    needs: sign
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, win32-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: backend-signed-${{ matrix.target }}
          path: signed

      - name: Package the VSIX with the signed backend
        run: pnpm package ${{ matrix.target }} --backend "$GITHUB_WORKSPACE/signed/${{ matrix.target }}.exe" --out release-artifacts

      # The binary that ships must be the one that was signed, byte for byte.
      - name: Check the packaged backend is the signed one
        run: |
          set -euo pipefail
          vsix="$(ls release-artifacts/*.vsix)"
          packaged="$(unzip -p "$vsix" "extension/bin/${{ matrix.target }}/NuGet.VisualStudioCode.exe" | sha256sum | cut -d' ' -f1)"
          signed="$(sha256sum "signed/${{ matrix.target }}.exe" | cut -d' ' -f1)"
          [[ "$packaged" == "$signed" ]] || {
            echo 'The VSIX does not carry the signed backend.' >&2
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: release-artifacts/*.vsix
          if-no-files-found: error

  publish:
    name: Publish
    needs: [targets, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Lets the job ask GitHub for the OIDC token that trusted publishing exchanges.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: release-artifacts
          merge-multiple: true

      - name: Decide what kind of release this is
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # The notes are the section of the version in the changelog. A tag pushed by hand for a version
          # the changelog does not have, such as a pre-release, falls back to generated notes.
          if pnpm exec tsx scripts/changelog.ts "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"; then
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.vsix --verify-tag "${flags[@]}"

      - name: Publish to Open VSX
        if: ${{ env.PRERELEASE == 'false' }}
        run: |
          for vsix in "$GITHUB_WORKSPACE"/release-artifacts/*.vsix; do
            pnpm --filter nuget-code exec ovsx publish "$vsix" --trusted-publishing
          done

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.PRERELEASE == 'false' }}
        run: |
          for vsix in "$GITHUB_WORKSPACE"/release-artifacts/*.vsix; do
            pnpm --filter nuget-code exec vsce publish --oidc --packagePath "$vsix"
          done
