# Weekly update pull requests against develop, the default branch. Minor and patch updates of an ecosystem
# come together; a major one comes on its own. The commits are chore(deps), which the changelog leaves out.
# A version is only proposed some days after it is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The SDK version of backend/global.json.
  - package-ecosystem: dotnet-sdk
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
