packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # A dependency of the Tailwind CLI's watch mode. Its prebuilt binary is enough; nothing is compiled here.
  "@parcel/watcher": false
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  unrs-resolver: true
# Versions with known vulnerabilities that the test runner of the editor (mocha, c8) still asks for. None of
# them is in the VSIX. Each line goes away when the package that asks for the old version is updated.
overrides:
  "diff@>=6.0.0 <8.0.3": ^8.0.3
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  "serialize-javascript@<7.1.3": ^7.1.3
